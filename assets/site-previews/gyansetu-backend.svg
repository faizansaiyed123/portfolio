<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Gyansetu AI backend project overview</title>
<desc id="desc">An illustrative, not literal, overview of the technologies Faizan worked with during his internship: a Python Flask backend, PostgreSQL, and AWS.</desc>
<defs>
