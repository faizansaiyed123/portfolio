  <g text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
    <text x="720" y="755" fill="#80938d" font-size="12">© 2026 Gyansetu One World AI</text>
    <text x="720" y="778" fill="#a0afa9" font-size="10" letter-spacing=".8">POWERED BY GYANSETU · PRODUCT OF RUHIL FUTURE TECHNOLOGIES</text>
