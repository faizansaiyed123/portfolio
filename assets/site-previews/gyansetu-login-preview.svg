    <text x="720" y="225" fill="#183b35" font-size="42" font-weight="700" letter-spacing="-1.2">Welcome to Gyansetu One World AI</text>
    <text x="720" y="264" fill="#688079" font-size="18">Choose your login type to access your dashboard</text>
  </g>
  <g filter="url(#shadow)">
