        <path d="M10 15h4M10 22h4M23 15h4M23 22h4"/>
      </g>
      <text x="92" y="15" fill="#193d35" font-size="23" font-weight="700">Teacher</text>
      <text x="92" y="46" fill="#657e76" font-size="14.5">Manage classes, assignments, attendance,</text>
