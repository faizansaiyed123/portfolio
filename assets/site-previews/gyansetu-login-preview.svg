      <g transform="translate(14 14)" fill="none" stroke="#b77a36" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 14 20 5l17 9-17 9Z"/><path d="M10 19v9c6 5 14 5 20 0v-9M37 14v13"/>
      </g>
