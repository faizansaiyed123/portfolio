    <path d="M13 31c8-2 13-8 18-18 2 11-2 20-11 24-3-1-5-3-7-6Z" fill="#e7fff4"/>
    <path d="M18 36c5-9 11-13 20-15" fill="none" stroke="#a9f0d5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="64" y="22" fill="#183b35" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing=".5">GYANSETU</text>
    <text x="65" y="41" fill="#66827a" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="2">ONE WORLD AI</text>
