      <rect x="92" y="93" width="145" height="34" rx="8" fill="#edf2fb"/>
      <text x="164.5" y="115" text-anchor="middle" fill="#3e619b" font-size="11" font-weight="700" letter-spacing=".8">TEACHER ACCESS</text>
    </g>
    <g transform="translate(140 550)">
