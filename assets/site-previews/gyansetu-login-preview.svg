<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Gyansetu One World AI login portal preview</title>
<desc id="desc">An illustrative visual preview based on the public Gyansetu login page content. It shows four login choices: Institute, Teacher, Parent and Student. This is not a captured screenshot.</desc>
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faf9"/><stop offset="1" stop-color="#edf5f3"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#167a68"/><stop offset="1" stop-color="#0d5c61"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1c8c76"/><stop offset="1" stop-color="#2aa68b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#173d37" flood-opacity=".09"/></filter>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#80aaa1" opacity=".22"/></pattern>
  <clipPath id="screen"><rect width="1440" height="810" rx="0"/></clipPath>
</defs>
<g clip-path="url(#screen)">
  <rect width="1440" height="810" fill="url(#page)"/>
  <rect width="1440" height="810" fill="url(#dots)" opacity=".35"/>
  <circle cx="1260" cy="155" r="245" fill="#b7ded3" opacity=".28"/>
  <circle cx="170" cy="730" r="230" fill="#c5e5db" opacity=".24"/>
  <rect x="0" y="0" width="1440" height="88" fill="#ffffff" opacity=".96"/>
  <path d="M0 88H1440" stroke="#dce9e5"/>
  <g transform="translate(86 19)">
