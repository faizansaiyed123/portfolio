      <text x="92" y="67" fill="#657e76" font-size="14.5">attendance, and communicate with teachers.</text>
      <path d="M516 28h17m-7-7 7 7-7 7" fill="none" stroke="#9061a7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="92" y="93" width="145" height="34" rx="8" fill="#f5eff8"/>
      <text x="164.5" y="115" text-anchor="middle" fill="#805194" font-size="11" font-weight="700" letter-spacing=".8">PARENT ACCESS</text>
    </g>
