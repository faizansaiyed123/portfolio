      <text x="92" y="46" fill="#657e76" font-size="14.5">Access courses, assignments, grades, and</text>
      <text x="92" y="67" fill="#657e76" font-size="14.5">your learning resources.</text>
      <path d="M516 28h17m-7-7 7 7-7 7" fill="none" stroke="#b77a36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="92" y="93" width="145" height="34" rx="8" fill="#fff3e4"/>
      <text x="164.5" y="115" text-anchor="middle" fill="#a66b2d" font-size="11" font-weight="700" letter-spacing=".8">STUDENT ACCESS</text>
