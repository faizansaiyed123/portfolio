name: Capture verified live-site previews

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-live-previews.yml"
      - "tools/capture-live-previews.mjs"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install temporary browser dependencies
        run: |
          npm init -y
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium

      - name: Visit live sites and capture genuine screenshots
        run: node tools/capture-live-previews.mjs

      - name: Preserve capture report and screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-preview-captures-${{ github.run_id }}
          path: |
            assets/site-previews/*.webp
            capture-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit screenshots and remove temporary capture tooling
        if: success()
        shell: bash
        run: |
          rm -f package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if compgen -G "assets/site-previews/*.webp" > /dev/null; then
            git add assets/site-previews/*.webp
            git rm -f .github/workflows/capture-live-previews.yml tools/capture-live-previews.mjs
            git commit -m "assets: add verified live-site preview captures"
            git push origin HEAD:main
          else
            echo "No live URL passed the capture checks; leaving temporary tooling for diagnosis."
          fi
