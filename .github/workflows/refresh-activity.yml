name: Refresh verified GitHub activity data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-activity.yml
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-github-activity-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main as the snapshot baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch every merged external pull request
        run: |
          set -euo pipefail
          mkdir -p data
          query='author:faizansaiyed123 is:pr is:merged -user:faizansaiyed123'
          page=1
          while true; do
            page_file="$(printf 'data/activity-search-page-%02d.json' "$page")"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --get "https://api.github.com/search/issues" \
              --data-urlencode "q=$query" \
              --data-urlencode "per_page=100" \
              --data-urlencode "sort=created" \
              --data-urlencode "order=desc" \
              --data-urlencode "page=$page" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "User-Agent: portfolio-public-activity-snapshot" \
              > "$page_file"

            jq -e '(.total_count | type == "number") and (.items | type == "array")' "$page_file" > /dev/null
            item_count="$(jq '.items | length' "$page_file")"
            total_count="$(jq '.total_count' "$page_file")"

            if [ "$item_count" -lt 100 ]; then
              break
            fi

            if [ "$page" -ge 10 ]; then
              if [ "$total_count" -gt 1000 ]; then
                echo "GitHub Search API exposes at most 1,000 results; refusing to publish a partial external-PR snapshot." >&2
                exit 1
              fi
              break
            fi

            page=$((page + 1))
          done

          jq -s '.' data/activity-search-page-*.json > data/activity-search.json.tmp
          jq '
            [.[].items[]]
            | unique_by(.html_url)
            | sort_by(.closed_at)
            | reverse
            | {
                schemaVersion: 1,
                owner: "faizansaiyed123",
                query: "author:faizansaiyed123 is:pr is:merged -user:faizansaiyed123",
                scope: "Merged pull requests authored by this account in repositories not owned by the account. This is a complete external merged-PR list, not a count of every GitHub contribution type.",
                fetchedAt: (now | todate),
                total: length,
                items: map({
                  title: .title,
                  repository: (.repository_url | sub("https://api.github.com/repos/"; "")),
                  number: .number,
                  url: .html_url,
                  mergedAt: .closed_at,
                  kind: (
                    if (.repository_url | contains("ci-agent-audit")) then "Security and CI tooling"
                    elif (.repository_url | contains("community.postgresql")) then "Database automation"
                    elif (.repository_url | contains("rk-deploy")) then "Deployment tooling"
                    elif (.repository_url | contains("memtomem")) then "CLI and security testing"
                    elif (.repository_url | contains("laya-guard")) then "Security and command policy"
                    elif (.repository_url | contains("sentry-javascript")) then "JavaScript SDK"
                    elif (.repository_url | contains("sentry-python")) then "Python SDK"
                    elif (.repository_url | contains("home-assistant")) then "Frontend and accessibility"
                    elif (.repository_url | contains("trustflow-sdk")) then "TypeScript SDK"
                    else "Open-source contribution"
                    end
                  )
                })
              }
          ' data/activity-search.json.tmp > data/activity.json.tmp

          jq -e '
            (.schemaVersion == 1)
            and (.total == (.items | length))
            and (.items | all(.[]; (.url | startswith("https://github.com/")) and (.mergedAt != null)))
          ' data/activity.json.tmp > /dev/null

          mv data/activity.json.tmp data/activity.json
          rm data/activity-search.json.tmp data/activity-search-page-*.json

      - name: Fetch the public GitHub contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          from="$(date -u -d '364 days ago' '+%Y-%m-%dT00:00:00Z')"
          to="$(date -u '+%Y-%m-%dT23:59:59Z')"
          query='
            query($login: String!, $from: DateTime!, $to: DateTime!) {
              user(login: $login) {
                contributionsCollection(
                  from: $from,
                  to: $to,
                ) {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        weekday
                      }
                    }
                  }
                  totalCommitContributions
                  totalIssueContributions
                  totalPullRequestContributions
                  totalPullRequestReviewContributions
                }
              }
            }
          '

          gh api graphql \
            -f query="$query" \
            -F login="faizansaiyed123" \
            -F from="$from" \
            -F to="$to" \
            > data/contributions-calendar-raw.json.tmp

          jq -e '.data.user.contributionsCollection.contributionCalendar.weeks | length > 0' \
            data/contributions-calendar-raw.json.tmp > /dev/null

          jq --arg owner "faizansaiyed123" --arg from "$from" --arg to "$to" '
            .data.user.contributionsCollection as $collection
            | {
                schemaVersion: 1,
                owner: $owner,
                source: "GitHub GraphQL contributionsCollection",
                scope: "Public profile contributions only. The workflow token does not request the optional read:user scope, so private and internal repository contributions are excluded. Includes GitHub-eligible public commits, pull requests, issues and reviews.",
                fetchedAt: (now | todate),
                range: { from: $from, to: $to },
                totalContributions: $collection.contributionCalendar.totalContributions,
                totals: {
                  commits: $collection.totalCommitContributions,
                  issues: $collection.totalIssueContributions,
                  pullRequests: $collection.totalPullRequestContributions,
                  pullRequestReviews: $collection.totalPullRequestReviewContributions
                },
                weeks: $collection.contributionCalendar.weeks
              }
          ' data/contributions-calendar-raw.json.tmp > data/contributions-calendar.json.tmp

          jq -e '
            (.schemaVersion == 1)
            and (.owner == "faizansaiyed123")
            and (.fetchedAt != null)
            and (.totalContributions >= 0)
            and (.weeks | length > 0)
            and (.weeks | all(.[]; (.contributionDays | length > 0)))
          ' data/contributions-calendar.json.tmp > /dev/null

          mv data/contributions-calendar.json.tmp data/contributions-calendar.json
          rm data/contributions-calendar-raw.json.tmp

      - name: Publish snapshot updates through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/activity.json data/contributions-calendar.json

          if ! git diff --cached --quiet; then
            update_branch="automation/public-github-snapshots"
            git switch --create "$update_branch"
            git commit -m "chore: refresh public GitHub activity data"

            # Only replace this dedicated automation branch, and only if it
            # still has the remote SHA observed immediately before the push.
            remote_sha="$(git ls-remote --heads origin "refs/heads/$update_branch" | awk 'NR == 1 { print $1 }')"
            if [ -n "$remote_sha" ]; then
              git push --force-with-lease="refs/heads/$update_branch:$remote_sha" origin "HEAD:refs/heads/$update_branch"
            else
              git push origin "HEAD:refs/heads/$update_branch"
            fi

            pr_number="$(gh pr list --base main --head "$update_branch" --state open --json number --jq '.[0].number // empty')"
            pr_title="chore: refresh public GitHub activity snapshots"
            pr_body="$(cat <<'BODY'
          This pull request contains only the refreshed public GitHub contribution snapshots and is queued for automatic squash merge after required checks pass:

          - data/activity.json: verified external merged pull requests.
          - data/contributions-calendar.json: public profile contributions from GitHub GraphQL.

          The snapshots are validated before this pull request is created. The portfolio reads them from the same main branch as the frontend. This workflow deliberately opens or updates a pull request rather than writing directly to protected main.

          The repository must allow GitHub Actions to create pull requests and must have auto-merge enabled. The main-branch owner-only ruleset remains in place.
          BODY
          )"

            if [ -n "$pr_number" ]; then
              gh pr edit "$pr_number" --title "$pr_title" --body "$pr_body"
            else
              if ! gh pr create --base main --head "$update_branch" --title "$pr_title" --body "$pr_body"; then
                echo "::error::Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests." >&2
                exit 1
              fi
            fi

            pr_number="$(gh pr list --base main --head "$update_branch" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$pr_number" ]; then
              echo "Could not find the automated public-snapshot pull request after publishing its branch." >&2
              exit 1
            fi

            # Keep main protected: GitHub merges this validated PR only after
            # auto-merge is enabled for the repository and required checks pass.
            if ! gh pr merge "$pr_number" --auto --squash; then
              echo "::error::Enable Settings > General > Pull Requests > Allow auto-merge so the verified snapshot PR can merge after checks pass." >&2
              exit 1
            fi
          fi
