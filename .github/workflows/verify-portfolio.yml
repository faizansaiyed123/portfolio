name: Verify portfolio
on:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - script.js
      - assets/site-previews/**
  permissions:
    contents: write
concurrency:
  group: portfolio-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Validate structure and local assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          source = Path("index.html").read_text(encoding="utf-8")
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids, self.hashes, self.files = [], [], []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"): self.ids.append(attrs["id"])
                  href, src = attrs.get("href", ""), attrs.get("src", "")
                  if href.startswith("#"): self.hashes.append(href[1:])
                  for value in (href, src):
                      if value.startswith("./"): self.files.append(value.split("?", 1)[0][2:])
          page = Page(); page.feed(source)
          duplicate_ids = sorted({x for x in page.ids if page.ids.count(x) > 1})
          broken_anchors = sorted(set(page.hashes) - set(page.ids))
          missing_files = sorted(x for x in page.files if not Path(x).is_file())
          counts = {name: len(re.findall(pattern, source)) for name, pattern in {
              "open_source": r'class="contribution-card"',
              "freelance": r'class="freelance-card"',
              "personal": r'class="personal-project-card"',
          }.items()}
          assert counts == {"open_source": 6, "freelance": 2, "personal": 18}, counts
          assert not duplicate_ids, duplicate_ids
          assert not broken_anchors, broken_anchors
          assert not missing_files, missing_files
          assert not re.search(r"MindBridge|mindbridge|19 / 19|19-project", source, re.I)
          assert "18 / 18 PROJECTS INDEXED" in source
          assert "Reworked the React Component Architect agent definition" in source
          assert all(tag in source for tag in ["Developer tooling", "Markdown", "React / Next.js guidance"])
          print({"cards": counts, "local_paths": len(page.files), "anchors": "pass", "assets": "pass", "mindbridge": "removed"})
          PY
      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/portfolio-server.log 2>&1 &
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on("pageerror", error => errors.push(error.message));
            const response = await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle" });
            assert.equal(response?.status(), 200);
            assert.equal(await page.locator(".contribution-card").count(), 6);
            assert.equal(await page.locator(".freelance-card").count(), 2);
            assert.equal(await page.locator(".personal-project-card").count(), 18);
            assert.equal(await page.getByRole("heading", { name: "MindBridge" }).count(), 0);
            const previews = await page.locator(".freelance-card img, .personal-project-preview img").evaluateAll(async images => Promise.all(images.map(async img => {
              img.loading = "eager";
              try { await img.decode(); return {src: img.getAttribute("src"), ok: img.naturalWidth > 0}; }
              catch { return {src: img.getAttribute("src"), ok: false}; }
            })));
            assert.equal(previews.length, 20);
            assert.deepEqual(previews.filter(x => !x.ok), []);
            await page.locator('[data-project-filter="fastapi"]').click();
            const filtered = await page.locator(".personal-project-card:not([hidden])").count();
            assert.ok(filtered > 0 && filtered < 18, "Technology filter should narrow the grid");
            await page.locator('[data-project-filter="all"]').click();
            assert.equal(await page.locator(".personal-project-card:not([hidden])").count(), 18);
            const before = await page.locator("html").getAttribute("data-theme");
            await page.locator(".theme-button").click();
            assert.notEqual(await page.locator("html").getAttribute("data-theme"), before);
            await page.setViewportSize({width: 390, height: 844});
            const columns = await page.locator(".personal-project-grid").evaluate(el => getComputedStyle(el).gridTemplateColumns.trim().split(/\s+/).length);
            assert.equal(columns, 1);
            await page.locator("#menu-button").click();
            assert.ok((await page.locator("#mobile-nav").getAttribute("class")).includes("is-open"));
            await page.locator('#mobile-nav a[href="#freelance"]').click();
            assert.ok(!(await page.locator("#mobile-nav").getAttribute("class")).includes("is-open"));
            assert.deepEqual(errors, []);
            console.log(JSON.stringify({cards:{openSource:6,freelance:2,personal:18},previews:previews.length,technologyFilters:"pass",themeToggle:"pass",mobileLayoutAndNavigation:"pass",browserErrors:errors},null,2));
          } finally { await browser.close(); }
          JS
      - name: Remove temporary validation workflow
        if: always()
        run: |
          rm -f package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/verify-portfolio.yml ]; then git rm -f .github/workflows/verify-portfolio.yml; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary portfolio verification workflow"
            git push origin HEAD:main
          fi
