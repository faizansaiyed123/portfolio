name: Capture product homepage screenshots
on:
  push:
    branches:
      - "feature/portfolio-client-internship-and-homepage-gallery"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture all 20 product and work homepages
        id: capture
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.mjs
        run: node scripts/capture-homepage-previews.mjs
      - name: Commit homepage screenshots and capture report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-previews data/homepage-preview-status.json
          if git diff --cached --quiet; then
            echo "No homepage screenshot files changed."
          else
            git commit -m "Capture authentic project homepage screenshots"
            git push origin HEAD:${{ github.ref_name }}
          fi
